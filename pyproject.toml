[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tape"
version = "0.1.0"
description = "Watches SEC 8-K filings, scores materiality with Jev, and briefs the ones that matter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "typesafe_sdk>=0.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
tape = "tape.cli:main"

[tool.setuptools]
packages = ["tape"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
